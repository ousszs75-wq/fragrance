<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amine Parfumerie 31</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0c;--card:#161614;--line:#2a2722;--gold:#c8a45a;--gold2:#e6cf94;--tx:#ece6d8;--mut:#9a9384}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Cairo,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#0d0d0cee;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{height:56px;display:block}.brand{font:600 22px 'Cormorant Garamond',serif;color:var(--gold2)}
.ib{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.ib:hover,.btn:hover{border-color:var(--gold)}
.hero{text-align:center;padding:36px 16px 12px}.hero h1{font:600 clamp(30px,6vw,52px) 'Cormorant Garamond',serif;color:var(--gold2);margin:0}
.hero p{color:var(--mut);margin:6px 0 0}
.tabs{display:flex;gap:8px;justify-content:center;padding:18px 16px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 18px;cursor:pointer;color:var(--mut)}
.tab.on{background:var(--gold);color:#111;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:8px 16px 40px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .im{aspect-ratio:1;background:#0a0a09 center/cover;display:grid;place-items:center;color:var(--line);font-size:48px}
.card .bd{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.card h3{margin:0;font-size:17px}
select,input{width:100%;background:#0a0a09;border:1px solid var(--line);border-radius:8px;padding:9px}
.btn{background:var(--gold);color:#111;border:1px solid var(--gold);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.g{background:none;color:var(--tx);border-color:var(--line)}.btn.r{background:none;color:#e07a6a;border-color:#5a2c26}
.adm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:#1d1a12;border-bottom:1px solid var(--gold)}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:none}.ov.on{display:block}
.pan{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--bg);border-inline-start:1px solid var(--line);padding:16px;overflow:auto}
.mod{position:absolute;inset:0;margin:auto;width:min(560px,94%);height:fit-content;max-height:92%;overflow:auto;background:var(--bg);border:1px solid var(--gold);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{min-width:0}
.ci{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:8px}
.q{display:flex;gap:6px;align-items:center;margin-top:4px}.q button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:none;cursor:pointer}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
footer{text-align:center;color:var(--mut);padding:24px;border-top:1px solid var(--line)}footer a{cursor:pointer;color:var(--mut)}
.tot{font-size:19px;color:var(--gold2);margin:14px 0}.empty{text-align:center;color:var(--mut);padding:40px 0}
#cn{background:var(--gold);color:#111;border-radius:99px;padding:0 7px;font-size:13px;margin-inline-start:4px}
</style></head><body>
<div id="adm"></div>
<header>
 <button class="ib" id="lg"></button>
 <div id="logoWrap"></div>
 <button class="ib" id="cb">🛒<span id="cn">0</span></button>
</header>
<div class="hero"><h1 id="h1"></h1><p id="sub"></p></div>
<div class="tabs" id="tabs"></div>
<main class="grid" id="grid"></main>
<footer><div id="ft"></div><a id="al"></a></footer>
<div class="ov" id="ov"><div id="ovc"></div></div>
<script>
const T={fr:{all:"Tout",flacon:"Flacons",sample:"Échantillons",add:"Ajouter au panier",cart:"Mon panier",empty:"Votre panier est vide.",total:"Total",order:"Commander",back:"Retour",ln:"Nom",fn:"Prénom",ph:"Téléphone",send:"Envoyer par WhatsApp",note:"Pas de paiement en ligne : vous payez à la réception de votre colis, après confirmation par WhatsApp.",sub:"Parfums de luxe — flacons et échantillons",none:"Aucun parfum pour le moment.",adm:"Admin",code:"Code d'accès admin",bad:"Code incorrect",addp:"+ Ajouter un parfum",set:"Paramètres",out:"Déconnexion",edit:"Modifier",del:"Supprimer",delq:"Supprimer ce parfum ?",nfr:"Nom (français)",nar:"Nom (arabe)",img:"Photo",vars:"Formats et prix (DA)",addv:"+ Ajouter un format",save:"Enregistrer",cancel:"Annuler",wa:"Numéro WhatsApp (avec indicatif, ex. 213550123456)",shop:"Nom de la boutique",saved:"Enregistré",err:"Erreur d'enregistrement",bt:"Flacon",sp:"Échantillon",lab:"Taille (ex. 100 ml)",req:"Remplissez tous les champs."},
ar:{all:"الكل",flacon:"قارورات",sample:"عينات",add:"أضف إلى السلة",cart:"سلتي",empty:"سلتك فارغة.",total:"المجموع",order:"اطلب الآن",back:"رجوع",ln:"اللقب",fn:"الاسم",ph:"رقم الهاتف",send:"إرسال عبر واتساب",note:"لا يوجد دفع إلكتروني: تدفع عند استلام طلبك، بعد التأكيد عبر واتساب.",sub:"عطور فاخرة — قارورات وعينات",none:"لا توجد عطور حالياً.",adm:"المشرف",code:"رمز دخول المشرف",bad:"الرمز غير صحيح",addp:"+ إضافة عطر",set:"الإعدادات",out:"خروج",edit:"تعديل",del:"حذف",delq:"حذف هذا العطر؟",nfr:"الاسم (فرنسي)",nar:"الاسم (عربي)",img:"الصورة",vars:"الأحجام والأسعار (دج)",addv:"+ إضافة حجم",save:"حفظ",cancel:"إلغاء",wa:"رقم واتساب (مع المفتاح، مثال 213550123456)",shop:"اسم المتجر",saved:"تم الحفظ",err:"خطأ في الحفظ",bt:"قارورة",sp:"عينة",lab:"الحجم (مثال 100 مل)",req:"املأ كل الحقول."}};
const D0={shop:"Amine Parfumerie 31",whatsapp:"213000000000",products:[
{id:"p1",fr:"King Tobacco",ar:"كينغ توباكو",image:"",variants:[{type:"flacon",label:"100 ml",price:12000},{type:"sample",label:"5 ml",price:1500}]},
{id:"p2",fr:"Liquide Brun Limited Edition",ar:"ليكيد برون إصدار محدود",image:"",variants:[{type:"flacon",label:"100 ml",price:15000},{type:"sample",label:"30 ml",price:4500}]}]};
let S=D0,lang=localStorage.lang||'fr',cart=JSON.parse(localStorage.cart||'[]'),code=sessionStorage.code||'',filter='all';
const $=id=>document.getElementById(id),t=k=>T[lang][k],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=p=>(lang=='ar'&&p.ar)?p.ar:p.fr, money=n=>Number(n).toLocaleString('fr-FR')+' DA';
async function load(){try{const j=await (await fetch('/api/store')).json();if(j&&j.products)S=j}catch(e){}render()}
async function save(){try{const r=await fetch('/api/store',{method:'POST',body:JSON.stringify({code,data:S})});if(!r.ok)throw 0;alert(t('saved'))}catch(e){alert(t('err'))}}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 document.title=S.shop;$('lg').textContent=lang=='fr'?'العربية':'Français';
 $('logoWrap').innerHTML=`<img class="logo" src="logo.png" alt="${esc(S.shop)}" onerror="this.outerHTML='<div class=brand>${esc(S.shop)}</div>'">`;
 $('h1').textContent=S.shop;$('sub').textContent=t('sub');$('ft').textContent='© '+S.shop;$('al').textContent=code?'':t('adm');
 $('tabs').innerHTML=['all','flacon','sample'].map(k=>`<button class="tab ${filter==k?'on':''}" data-f="${k}">${t(k)}</button>`).join('');
 $('adm').innerHTML=code?`<div class="adm"><button class="btn" id="a1">${t('addp')}</button><button class="btn g" id="a2">${t('set')}</button><button class="btn g" id="a3">${t('out')}</button></div>`:'';
 let h='';S.products.forEach(p=>{const vs=p.variants.map((v,i)=>({...v,i})).filter(v=>filter=='all'||v.type==filter);if(!vs.length)return;
 h+=`<div class="card"><div class="im" style="${p.image?`background-image:url(${p.image})`:''}">${p.image?'':'✦'}</div><div class="bd"><h3>${esc(nm(p))}</h3>
 <select id="v${p.id}">${vs.map(v=>`<option value="${v.i}">${t(v.type=='flacon'?'bt':'sp')} ${esc(v.label)} — ${money(v.price)}</option>`).join('')}</select>
 <button class="btn" data-add="${p.id}">${t('add')}</button>
 ${code?`<div class="row"><button class="btn g" data-ed="${p.id}">${t('edit')}</button><button class="btn r" data-rm="${p.id}">${t('del')}</button></div>`:''}</div></div>`});
 $('grid').innerHTML=h||`<div class="empty" style="grid-column:1/-1">${t('none')}</div>`;
 $('cn').textContent=cart.reduce((a,c)=>a+c.q,0);localStorage.cart=JSON.stringify(cart);localStorage.lang=lang}
function open(h){$('ovc').innerHTML=h;$('ov').classList.add('on')}function close(){$('ov').classList.remove('on')}
$('ov').onclick=e=>{if(e.target.id=='ov')close()};
$('lg').onclick=()=>{lang=lang=='fr'?'ar':'fr';render()};
$('tabs').onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;render()}};
$('grid').onclick=e=>{const d=e.target.dataset;
 if(d.add){const p=S.products.find(x=>x.id==d.add),v=p.variants[$('v'+p.id).value],k=p.id+'|'+v.label+v.type,c=cart.find(x=>x.k==k);
  c?c.q++:cart.push({k,fr:p.fr,ar:p.ar||p.fr,type:v.type,label:v.label,price:v.price,q:1});render();cartView()}
 if(d.ed)editor(d.ed);
 if(d.rm&&confirm(t('delq'))){S.products=S.products.filter(p=>p.id!=d.rm);render();save()}};
$('cb').onclick=cartView;
function cartView(){const tot=cart.reduce((a,c)=>a+c.price*c.q,0);
 open(`<div class="pan"><div class="row"><h2 style="flex:1;margin:0">${t('cart')}</h2><button class="ib" onclick="close()">✕</button></div>
 ${cart.length?cart.map((c,i)=>`<div class="ci"><div><b>${esc(lang=='ar'?c.ar:c.fr)}</b><br><small>${t(c.type=='flacon'?'bt':'sp')} ${esc(c.label)} — ${money(c.price)}</small></div>
 <div class="q"><button onclick="qt(${i},-1)">−</button>${c.q}<button onclick="qt(${i},1)">+</button></div></div>`).join('')+
 `<div class="tot">${t('total')} : ${money(tot)}</div><button class="btn" style="width:100%" onclick="form()">${t('order')}</button>`:`<div class="empty">${t('empty')}</div>`}</div>`)}
function qt(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);render();cartView()}
function form(){open(`<div class="pan"><div class="row"><button class="ib" onclick="cartView()">${t('back')}</button></div>
 <label>${t('ln')}</label><input id="fl"><label>${t('fn')}</label><input id="ff"><label>${t('ph')}</label><input id="fp" type="tel" inputmode="tel">
 <p style="color:var(--mut);font-size:14px">${t('note')}</p><button class="btn" style="width:100%" onclick="send()">${t('send')}</button></div>`)}
function send(){const l=$('fl').value.trim(),f=$('ff').value.trim(),p=$('fp').value.trim();if(!l||!f||!p)return alert(t('req'));
 const tot=cart.reduce((a,c)=>a+c.price*c.q,0);
 const msg=`🛒 Nouvelle commande — ${S.shop}\n\n👤 ${f} ${l}\n📞 ${p}\n\n`+cart.map(c=>`• ${c.q} × ${c.fr} (${c.type=='flacon'?'Flacon':'Échantillon'} ${c.label}) = ${money(c.price*c.q)}`).join('\n')+`\n\n💰 Total : ${money(tot)}\n💵 Paiement à la livraison`;
 window.open('https://wa.me/'+S.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank');cart=[];render();close()}
// ---- Admin ----
$('al').onclick=async()=>{const c=prompt(t('code'));if(!c)return;
 try{const r=await fetch('/api/store',{method:'POST',body:JSON.stringify({code:c})});if(!r.ok)throw 0;code=c;sessionStorage.code=c;render()}catch(e){alert(t('bad'))}};
document.addEventListener('click',e=>{const id=e.target.id;
 if(id=='a1')editor();if(id=='a2')settings();if(id=='a3'){code='';sessionStorage.code='';render()}});
function settings(){open(`<div class="mod"><label>${t('shop')}</label><input id="s1" value="${esc(S.shop)}"><label>${t('wa')}</label><input id="s2" value="${esc(S.whatsapp)}">
 <div class="row" style="margin-top:16px"><button class="btn" id="ss">${t('save')}</button><button class="btn g" onclick="close()">${t('cancel')}</button></div></div>`);
 $('ss').onclick=()=>{S.shop=$('s1').value.trim()||S.shop;S.whatsapp=$('s2').value.trim();close();render();save()}}
let tmpImg='';
function vrow(v){return `<div class="row vr"><select><option value="flacon" ${v.type=='flacon'?'selected':''}>${t('bt')}</option><option value="sample" ${v.type=='sample'?'selected':''}>${t('sp')}</option></select>
 <input placeholder="${t('lab')}" value="${esc(v.label)}"><input type="number" min="0" placeholder="DA" value="${v.price}" style="max-width:110px"><button class="btn r" onclick="this.parentNode.remove()">✕</button></div>`}
function editor(id){const p=S.products.find(x=>x.id==id)||{id:'p'+Date.now(),fr:'',ar:'',image:'',variants:[{type:'flacon',label:'100 ml',price:0}]};tmpImg=p.image;
 open(`<div class="mod"><label>${t('nfr')}</label><input id="e1" value="${esc(p.fr)}"><label>${t('nar')}</label><input id="e2" value="${esc(p.ar)}" dir="rtl">
 <label>${t('img')}</label><input type="file" accept="image/*" id="e3"><div class="im" id="pv" style="height:90px;width:90px;margin-top:8px;border-radius:8px;background:#0a0a09 center/cover ${p.image?`url(${p.image})`:''}"></div>
 <label>${t('vars')}</label><div id="vl">${p.variants.map(vrow).join('')}</div><button class="btn g" id="av">${t('addv')}</button>
 <div class="row" style="margin-top:16px"><button class="btn" id="es">${t('save')}</button><button class="btn g" onclick="close()">${t('cancel')}</button></div></div>`);
 $('av').onclick=()=>$('vl').insertAdjacentHTML('beforeend',vrow({type:'flacon',label:'',price:0}));
 $('e3').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const m=500,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpImg=c.toDataURL('image/jpeg',.72);$('pv').style.backgroundImage=`url(${tmpImg})`};im.src=URL.createObjectURL(f)};
 $('es').onclick=()=>{p.fr=$('e1').value.trim();p.ar=$('e2').value.trim();if(!p.fr)return;p.image=tmpImg;
  p.variants=[...document.querySelectorAll('.vr')].map(r=>({type:r.children[0].value,label:r.children[1].value.trim(),price:+r.children[2].value||0})).filter(v=>v.label);
  if(!S.products.includes(p))S.products.push(p);close();render();save()}}
load();
</script></body></html>
